<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Entrenos 2026</title>
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
  --txt:#e9edf4; --dim:#9aa4b5; --dim2:#6d7787;
  --acc:#f5a524; --ok:#2ecc71; --bad:#ff5c5c; --blue:#5aa9ff;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:86px}
a{color:var(--blue)}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 0}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0f1115 78%,rgba(15,17,21,0));
  padding:10px 12px 12px}
.hdr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;max-width:720px;margin:0 auto}
.hdr h1{font-size:15px;margin:0;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.hdr .date{font-size:13px;color:var(--dim2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.hi{border-color:#3b3320;background:linear-gradient(180deg,#1d1a12,#171a21)}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:6px}
h2{font-size:21px;margin:0 0 4px;line-height:1.2}
h3{font-size:15px;margin:18px 0 8px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.sub{color:var(--dim);font-size:14px;margin:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--dim)}
.pill b{color:var(--txt);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;
  background:var(--acc);color:#141414;margin-top:12px;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:600;padding:12px}
.btn:active{transform:scale(.99)}
.row{display:flex;gap:8px}
.row>*{flex:1}
/* ejercicio */
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;scroll-margin-top:72px}
.ex.done{border-color:#1f4a32}
.exh{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;cursor:pointer}
.num{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;color:var(--dim);font-weight:700;margin-top:2px}
.ex.done .num{background:#1b3d2b;border-color:#2b6045;color:#7ee2ab}
.exh .t{flex:1;min-width:0}
.exh .t b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.exh .t span{font-size:12.5px;color:var(--dim)}
.chev{color:var(--dim2);font-size:13px;margin-top:4px;transition:transform .2s}
.ex.open .chev{transform:rotate(180deg)}
.exb{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.ex.open .exb{display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.meta i{font-style:normal;background:var(--card2);border:1px solid var(--line);border-radius:8px;
  padding:4px 8px;font-size:11.5px;color:var(--dim)}
.meta i b{color:var(--txt);font-weight:600}
.tip{font-size:13px;color:var(--dim);margin:10px 0 0;padding-left:10px;border-left:2px solid var(--line)}
.tip b{color:#cbd4e2;font-weight:600}
.prev{margin:10px 0 0;font-size:13px;background:var(--card2);border-radius:10px;padding:9px 11px;color:var(--dim)}
.prev b{color:var(--txt)}
.prev.up{background:#14301f;color:#a8e9c4}
.prev.up b{color:#fff}
/* series */
table.sets{width:100%;border-collapse:collapse;margin-top:12px}
table.sets th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:600;
  padding:0 0 6px;text-align:center}
table.sets th:first-child{text-align:left;width:34px}
table.sets td{padding:3px 2px}
table.sets td:first-child{color:var(--dim);font-size:12px;font-weight:700}
input.n{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
  padding:11px 4px;font-size:16px;text-align:center;font-family:inherit;-moz-appearance:textfield}
input.n:focus{outline:none;border-color:var(--acc)}
input.n::-webkit-outer-spin-button,input.n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chk{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  color:var(--dim2);font-size:17px;cursor:pointer}
.chk.on{background:#1b3d2b;border-color:#2b6045;color:#7ee2ab}
td.cw{width:44px}
/* progreso */
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,21,27,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--dim2);padding:11px 4px 13px;font-size:10.5px;
  font-family:inherit;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
nav button b{display:block;font-size:19px;line-height:1.35;font-weight:400}
nav button.on{color:var(--acc)}
/* calendario */
.day{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;
  margin-bottom:7px;background:var(--card);cursor:pointer}
.day.today{border-color:var(--acc)}
.day.off{opacity:.5;cursor:default}
.day.hecho{border-color:#2b6045}
.day .d{width:44px;flex:0 0 44px;text-align:center}
.day .d b{display:block;font-size:17px;line-height:1}
.day .d span{font-size:10px;color:var(--dim2);text-transform:uppercase}
.day .i{flex:1;min-width:0}
.day .i b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .i span{font-size:12px;color:var(--dim)}
.day .s{font-size:12px;color:var(--dim2)}
.wk{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin:16px 0 8px}
/* historial */
.hrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.hrow:last-child{border:0}
.hrow b{font-size:14.5px;font-weight:600}
.hrow span{font-size:12px;color:var(--dim)}
.hrow em{font-style:normal;font-size:13px;color:var(--acc);white-space:nowrap}
select.sel{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
  padding:12px;font-size:15px;font-family:inherit}
textarea{width:100%;height:160px;background:#0b0d11;border:1px solid var(--line);color:var(--dim);
  border-radius:12px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:pre}
.note{font-size:12.5px;color:var(--dim2);margin-top:10px}
.warn{font-size:12.5px;color:#ffb4b4;background:#2a1618;border:1px solid #4a2528;border-radius:10px;padding:9px 11px;margin-top:10px}
.spark{display:block;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#e9edf4;color:#141414;
  padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:50;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hidden{display:none}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <h1>Entrenos 2026</h1>
    <div class="date" id="hoyTxt"></div>
  </div>
</header>

<div class="wrap">
  <div id="v-hoy"></div>
  <div id="v-plan" class="hidden"></div>
  <div id="v-hist" class="hidden"></div>
  <div id="v-exp" class="hidden"></div>
</div>

<nav>
  <button data-v="hoy" class="on"><b>&#9679;</b>Hoy</button>
  <button data-v="plan"><b>&#9776;</b>Plan</button>
  <button data-v="hist"><b>&#9636;</b>Historial</button>
  <button data-v="exp"><b>&#8681;</b>Datos</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ENTRENOS 2026 · datos extraídos de la hoja
   "ENTRENAMIENTOS MAESTRO 2026" (Google Sheets, 05/08/2026)
   Pestañas usadas: RUTINAS DEL BLOQUE · EJECUCIÓN EXACTA +
   CALENDARIO EJECUTABLE 03/08/2026–15/09/2026
   ============================================================ */

const SESIONES = {
  U1:{nom:'TORSO A · tensión', min:'65–75 min', foco:'Pecho/espalda + deltoides/brazos', ej:[
    {n:'Press inclinado máquina o mancuernas neutras',g:'Pecho',t:'Compuesto',s:3,r:'6–10',rir:'2',d:'2–3 min',ref:'20 kg×2 documentados',k:'Escápulas estables; rango cómodo',alt:'Máquina convergente neutra'},
    {n:'Remo con pecho apoyado neutro',g:'Espalda',t:'Compuesto',s:3,r:'6–10',rir:'2',d:'2–3 min',ref:'35 kg / barra+25 según máquina',k:'Pecho pegado; pausa breve',alt:'Remo sentado neutro'},
    {n:'Jalón al pecho neutro',g:'Espalda',t:'Compuesto',s:3,r:'8–12',rir:'2',d:'2 min',ref:'40 kg documentados',k:'Codos a costillas; sin tirón cervical',alt:'Jalón unilateral en polea'},
    {n:'Cruce en polea baja→alta',g:'Pecho',t:'Aislamiento',s:2,r:'10–15',rir:'1–2',d:'75–90 s',ref:'Calibrar',k:'Pecho alto; sin estiramiento agresivo',alt:'Press máquina inclinado'},
    {n:'Elevación lateral en polea',g:'Deltoide',t:'Aislamiento',s:4,r:'12–20',rir:'1–2',d:'60–75 s',ref:'Equiv. 8→6 kg mancuerna',k:'Hombro lejos de la oreja; sin balanceo',alt:'Máquina lateral'},
    {n:'Curl predicador máquina/polea',g:'Bíceps',t:'Aislamiento',s:3,r:'8–12',rir:'1–2',d:'75–90 s',ref:'Barra Z+17,5 kg referencia',k:'Codo estable; extensión cómoda',alt:'Curl polea al costado'},
    {n:'Pushdown tríceps cuerda',g:'Tríceps',t:'Aislamiento',s:3,r:'8–12',rir:'1–2',d:'75–90 s',ref:'15 kg documentados',k:'Codos fijos; separar la cuerda abajo',alt:'Extensión unilateral cruzada'}
  ]},
  L1:{nom:'PIERNA · mantenimiento', min:'45–55 min', foco:'Pierna + core sin fatiga sistémica', ej:[
    {n:'Prensa o hack squat',g:'Cuádriceps',t:'Compuesto',s:3,r:'8–12',rir:'2–3',d:'2–3 min',ref:'100 kg en prensa (histórico)',k:'Pelvis estable; exhalar al esfuerzo',alt:'Extensión de cuádriceps'},
    {n:'Curl femoral sentado/tumbado',g:'Isquios',t:'Aislamiento',s:3,r:'10–15',rir:'1–2',d:'90 s',ref:'35–40 kg según máquina',k:'Excéntrica controlada',alt:'RDL ligero con straps'},
    {n:'Hip thrust máquina/barra',g:'Glúteo',t:'Compuesto',s:2,r:'8–12',rir:'2',d:'2 min',ref:'90 kg histórico',k:'Pausa arriba; no hiperextender',alt:'Puente en máquina'},
    {n:'Extensión de cuádriceps',g:'Cuádriceps',t:'Aislamiento',s:2,r:'12–15',rir:'1–2',d:'75–90 s',ref:'30–35 kg histórico',k:'Sin rebote ni bloqueo agresivo',alt:'Prensa ligera'},
    {n:'Gemelos máquina',g:'Gemelos',t:'Aislamiento',s:3,r:'10–15',rir:'1–2',d:'75 s',ref:'Calibrar',k:'Pausa abajo y arriba',alt:'Gemelo en prensa'},
    {n:'Pallof press',g:'Core',t:'Estabilidad',s:2,r:'10–12/lado',rir:'3',d:'60 s',ref:'Ligero',k:'Respirar; sin presión máxima',alt:'Dead bug'}
  ]},
  U2:{nom:'TORSO B · brazos primero', min:'60–70 min', foco:'Bíceps/tríceps prioritarios', ej:[
    {n:'Elevación lateral en polea',g:'Deltoide',t:'Aislamiento',s:3,r:'12–20',rir:'2',d:'60–75 s',ref:'Calibrar',k:'Activar sin fatigar la articulación',alt:'Máquina lateral'},
    {n:'Curl predicador máquina/polea',g:'Bíceps',t:'Aislamiento',s:3,r:'8–12',rir:'1–2',d:'75–90 s',ref:'Barra Z+17,5 kg referencia',k:'Prioridad del día; técnica estricta',alt:'Curl polea al costado'},
    {n:'Pushdown tríceps cuerda',g:'Tríceps',t:'Aislamiento',s:3,r:'8–12',rir:'1–2',d:'75–90 s',ref:'15 kg documentados',k:'Superset con curl si no bajan las reps',alt:'Extensión unilateral cruzada'},
    {n:'Press inclinado máquina neutra',g:'Pecho',t:'Compuesto',s:3,r:'8–12',rir:'2',d:'2 min',ref:'Calibrar',k:'Recorrido estable; sin dolor anterior',alt:'Mancuernas neutras'},
    {n:'Jalón unilateral neutro',g:'Espalda',t:'Compuesto',s:3,r:'10–15/lado',rir:'2',d:'90 s',ref:'Calibrar',k:'Costillas controladas; codo a cadera',alt:'Jalón neutro bilateral'},
    {n:'Remo sentado neutro',g:'Espalda',t:'Compuesto',s:3,r:'8–12',rir:'2',d:'2 min',ref:'30 kg registro de polea',k:'Tronco quieto; no retraer de más',alt:'Remo pecho apoyado'},
    {n:'Curl inclinado o cable detrás',g:'Bíceps',t:'Aislamiento',s:2,r:'10–15',rir:'1–2',d:'75 s',ref:'Calibrar',k:'Solo rango cómodo del hombro',alt:'Curl martillo'},
    {n:'Extensión tríceps overhead polea',g:'Tríceps',t:'Aislamiento',s:2,r:'10–15',rir:'1–2',d:'75 s',ref:'Calibrar',k:'Solo si el hombro va 0–2/10',alt:'Extensión cruzada / pushdown'},
    {n:'Reverse fly en polea',g:'Deltoide posterior',t:'Aislamiento',s:2,r:'15–20',rir:'1–2',d:'60–75 s',ref:'6–8 kg mancuerna referencia',k:'Sin encoger el trapecio',alt:'Pájaro apoyado'}
  ]},
  U3:{nom:'TORSO C · pump', min:'45–55 min', foco:'Torso + brazos, estímulo metabólico', ej:[
    {n:'Press inclinado máquina',g:'Pecho',t:'Compuesto',s:2,r:'10–15',rir:'2',d:'90 s',ref:'Calibrar',k:'Tensión continua; sin grind',alt:'Mancuernas neutras'},
    {n:'Remo pecho apoyado',g:'Espalda',t:'Compuesto',s:2,r:'10–15',rir:'2',d:'90 s',ref:'Calibrar',k:'Pausa breve; limpio',alt:'Remo sentado neutro'},
    {n:'Cruce polea baja→alta',g:'Pecho',t:'Aislamiento',s:2,r:'12–20',rir:'1–2',d:'60–75 s',ref:'Calibrar',k:'Pecho alto; rango cómodo',alt:'Press inclinado ligero'},
    {n:'Pullover cable/máquina',g:'Espalda',t:'Aislamiento',s:2,r:'12–20',rir:'1–2',d:'60–75 s',ref:'Calibrar',k:'Costillas abajo; sentir el dorsal',alt:'Jalón unilateral'},
    {n:'Elevación lateral polea/máquina',g:'Deltoide',t:'Aislamiento',s:4,r:'15–25',rir:'1–2',d:'45–60 s',ref:'Calibrar',k:'Sin impulso; tensión continua',alt:'Mancuernas 8→6 kg'},
    {n:'Reverse fly polea',g:'Deltoide posterior',t:'Aislamiento',s:2,r:'15–25',rir:'1–2',d:'45–60 s',ref:'Calibrar',k:'Hombros bajos',alt:'Pájaro apoyado'},
    {n:'Curl martillo mancuernas/polea',g:'Bíceps',t:'Aislamiento',s:3,r:'10–15',rir:'1–2',d:'60–75 s',ref:'14 kg×2 documentados',k:'Sin balanceo',alt:'Curl cuerda'},
    {n:'Extensión tríceps cruzada/pushdown',g:'Tríceps',t:'Aislamiento',s:3,r:'10–15',rir:'1–2',d:'60–75 s',ref:'15 kg referencia',k:'Codo fijo; bombeo sin dolor',alt:'Cuerda bilateral'}
  ]},
  PICO:{nom:'MEDICIÓN + PUMP', min:'20–25 min', foco:'Fotos/medidas y presencia · medir en frío, pump después', ej:[
    {n:'Elevación lateral polea',g:'Deltoide',t:'Pump',s:2,r:'20',rir:'3',d:'30–45 s',ref:'Ligero',k:'Bombeo, no fatiga',alt:'Máquina lateral'},
    {n:'Curl polea',g:'Bíceps',t:'Pump',s:2,r:'15',rir:'3',d:'30–45 s',ref:'Ligero',k:'Tensión continua',alt:'Curl martillo'},
    {n:'Pushdown cuerda',g:'Tríceps',t:'Pump',s:2,r:'15',rir:'3',d:'30–45 s',ref:'Ligero',k:'Tensión continua',alt:'Extensión cruzada'},
    {n:'Cruce polea',g:'Pecho',t:'Pump',s:2,r:'15',rir:'3',d:'30–45 s',ref:'Ligero',k:'Rango cómodo',alt:'Press ligero'},
    {n:'Pullover cable',g:'Espalda',t:'Pump',s:2,r:'15',rir:'3',d:'30–45 s',ref:'Ligero',k:'Costillas abajo',alt:'Jalón ligero'}
  ]}
};

const FASES = ['Calibración','Volumen completo','Sobrecarga','Especialización','Máximo productivo','Disipar fatiga','Pico visual'];

// Volumen / RIR por semana y sesión (columna "Volumen/RIR" del calendario)
const RIRW = {
  1:{U1:'Comp RIR 3 · Aisl RIR 2',L1:'RIR 2–3',U2:'RIR 2 · aisl −1 serie',U3:'RIR 2 · aisl −1 serie'},
  2:{U1:'RIR 2',L1:'RIR 2–3',U2:'RIR 2',U3:'RIR 2'},
  3:{U1:'RIR 1–2',L1:'RIR 2–3',U2:'RIR 1–2',U3:'RIR 1–2'},
  4:{U1:'RIR 1–2',L1:'RIR 2–3',U2:'RIR 1–2',U3:'RIR 1–2'},
  5:{U1:'RIR 1–2',L1:'RIR 2–3',U2:'RIR 1–2',U3:'RIR 1–2'},
  6:{U1:'RIR 2 · −20% series',L1:'RIR 3 · −20% series',U2:'RIR 2 · −25% volumen',U3:'RIR 2 · −40% volumen'}
};
const NOTAW = {
  1:{U1:'Calibrar cargas y técnica',L1:'Respiración continua; sin máximos',U2:'Calibrar; una serie menos en aislamientos',U3:'Calibrar; una serie menos en aislamientos'},
  2:{U1:'Doble progresión',L1:'Respiración continua; sin máximos',U2:'Brazos primero; registrar anclas',U3:'Técnica limpia; sin técnicas exóticas'},
  3:{U1:'Doble progresión',L1:'Respiración continua; sin máximos',U2:'Brazos primero; registrar anclas',U3:'Técnica limpia; sin técnicas exóticas'},
  4:{U1:'Doble progresión',L1:'Respiración continua; sin máximos',U2:'Brazos primero; registrar anclas',U3:'Solo si recuperas: +1 serie de bíceps y tríceps'},
  5:{U1:'Doble progresión',L1:'Respiración continua; sin máximos',U2:'Brazos primero; registrar anclas',U3:'Solo si recuperas: +1 serie de bíceps y tríceps'},
  6:{U1:'Salir fresco; nada al fallo',L1:'Quitar 1 serie por ejercicio; sin máximos',U2:'Quitar 1 serie por ejercicio; sin fallo',U3:'Dos series por ejercicio; salir fresco'}
};

const INICIO='2026-08-03', FIN='2026-09-15';
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS3=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function iso(d){return d.toISOString().slice(0,10)}
function parse(s){const p=s.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]))}
function fmt(s){const d=parse(s);return d.getUTCDate()+' '+MESES[d.getUTCMonth()]}

function calendario(){
  const out=[]; let d=parse(INICIO); const fin=parse(FIN); let i=0;
  while(d<=fin){
    const k=iso(d), dw=d.getUTCDay(), wk=Math.floor(i/7)+1;
    let code, nom, tipo='fuerza', nota='', rir='';
    if(k==='2026-09-14'){code='PICO-0';nom='DESCANSO PICO';tipo='off';nota='Recargar sin distensión; carbohidrato normal-alto';}
    else if(k==='2026-09-15'){code='PICO';nom='MEDICIÓN + PUMP';nota='Medir en frío; pump después';}
    else if(dw===1){code='U1';}
    else if(dw===2){code='L1';}
    else if(dw===3){code='U2';}
    else if(dw===4){code='U3';}
    else if(dw===5){code='OPT';nom='OPCIONAL · rescatar sesión perdida';tipo='opt';
      nota='Si faltó un entreno L–J, ejecútalo aquí. Si completaste L–J, descansa.';}
    else if(dw===6){code='OFF';nom='DESCANSO';tipo='off';nota='Sin fuerza programada';}
    else {code='OFF-REV';nom='DESCANSO + REVISIÓN';tipo='off';nota='Media de peso + cintura + sueño + adherencia';}
    if(SESIONES[code]&&code!=='PICO'){nom=SESIONES[code].nom; nota=(NOTAW[wk]&&NOTAW[wk][code])||''; rir=(RIRW[wk]&&RIRW[wk][code])||'';}
    out.push({fecha:k,dw:dw,semana:wk,fase:FASES[wk-1],code:code,nom:nom,tipo:tipo,nota:nota,rir:rir});
    d=new Date(d.getTime()+864e5); i++;
  }
  return out;
}
const CAL=calendario();
const byDate={}; CAL.forEach(function(c){byDate[c.fecha]=c});

// Series ajustadas por semana (S1: −1 serie en aislamientos de brazos/deltoides; S6: recorte del calendario)
const BRAZOS=['Bíceps','Tríceps','Deltoide','Deltoide posterior'];
function seriesDe(ex,wk,code){
  var s=ex.s;
  if(wk===1&&ex.t==='Aislamiento'&&BRAZOS.indexOf(ex.g)>=0) s=s-1;
  if(wk===6){var f={U1:.8,L1:.8,U2:.75,U3:.6}[code]; if(f) s=Math.round(s*f);}
  return Math.max(1,s);
}

var MEM={}, PERSIST=true;
try{ if(!window.localStorage) throw 0; localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ PERSIST=false; }
function load(){

function setSesion(fecha,obj){ DB[fecha]=obj; save(DB); }

  clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on')},1600)}

/* --------- histórico por ejercicio --------- */
function ultimaVez(nombre,antesDe){
  var mejores=null, fecha=null;
  Object.keys(DB).sort().forEach(function(f){
    if(f>=antesDe) return;
    var s=DB[f]; if(!s||!s.sets) return;
    var sets=s.sets.filter(function(x){return x.ex===nombre && x.reps});
    if(sets.length){ mejores=sets; fecha=f; }
  });
  return mejores?{fecha:fecha,sets:mejores}:null;
}
function topRango(r){var m=(r+'').match(/(\d+)\s*[–-]\s*(\d+)/); if(m) return +m[2];
  var m2=(r+'').match(/(\d+)/); return m2?+m2[1]:null}
function sugerencia(ex,prev){
  if(!prev) return null;
  var top=topRango(ex.r); if(!top) return null;
  var ok=prev.sets.length>0 && prev.sets.every(function(s){return (+s.reps||0)>=top});
  return ok?'subir':'repetir';
}

function totalSeries(c){
  var S=SESIONES[c.code]; if(!S) return 0;

}

function exHTML(ex,i,c,reg){
  var nser=seriesDe(ex,c.semana,c.code);
  var prev=ultimaVez(ex.n,c.fecha);
  var sug=sugerencia(ex,prev);
  var mias=[];
  for(var k=0;k<nser;k++){
    var s=(reg.sets||[]).filter(function(x){return x.ex===ex.n&&x.serie===k+1})[0]||{kg:'',reps:'',rir:'',done:false};
    mias.push(s);
  }
  var hechas=mias.filter(function(s){return s.done}).length;
  var rows=mias.map(function(s,k){
    var id=i+'_'+(k+1);
    return '<tr>'+
      '<td>'+(k+1)+'</td>'+
      '<td><input class="n" inputmode="decimal" type="number" step="0.5" placeholder="kg" value="'+(s.kg||'')+'" oninput="setSet('+i+','+(k+1)+',\'kg\',this.value)"></td>'+
      '<td><input class="n" inputmode="numeric" type="number" placeholder="reps" value="'+(s.reps||'')+'" oninput="setSet('+i+','+(k+1)+',\'reps\',this.value)"></td>'+
      '<td><input class="n" inputmode="numeric" type="number" placeholder="RIR" value="'+(s.rir||'')+'" oninput="setSet('+i+','+(k+1)+',\'rir\',this.value)"></td>'+
      '<td class="cw"><button class="chk'+(s.done?' on':'')+'" id="chk'+id+'" onclick="marcar('+i+','+(k+1)+')">&#10003;</button></td>'+
    '</tr>';
  }).join('');
  var prevTxt='';
  if(prev){
    var det=prev.sets.map(function(s){return s.reps+(s.kg?'×'+s.kg+' kg':'')}).join(' · ');
    prevTxt='<div class="prev'+(sug==='subir'?' up':'')+'"><b>'+(sug==='subir'?'Toca subir peso':'Última vez '+fmt(prev.fecha))+'</b> · '+esc(det)+
      (sug==='subir'?' · llegaste al tope del rango en todas las series':'')+'</div>';
  }else{
    prevTxt='<div class="prev">Sin registro previo · referencia de la hoja: <b>'+esc(ex.ref)+'</b></div>';
  }
  return '<div class="ex'+(hechas===nser&&nser?' done':'')+'" id="ex'+i+'">'+
    '<div class="exh" onclick="toggle('+i+')">'+
      '<div class="num">'+(hechas===nser&&nser?'&#10003;':(i+1))+'</div>'+
      '<div class="t"><b>'+esc(ex.n)+'</b><span>'+nser+'×'+esc(ex.r)+' · RIR '+esc(ex.rir)+' · '+esc(ex.d)+' · '+esc(ex.g)+'</span></div>'+
      '<div class="chev">&#9660;</div>'+
    '</div>'+
    '<div class="exb">'+
      '<div class="meta"><i>Series <b>'+nser+'</b></i><i>Reps <b>'+esc(ex.r)+'</b></i><i>RIR <b>'+esc(ex.rir)+'</b></i><i>Descanso <b>'+esc(ex.d)+'</b></i><i>'+esc(ex.t)+'</i></div>'+
      prevTxt+
      '<table class="sets"><tr><th></th><th>kg</th><th>reps</th><th>RIR</th><th></th></tr>'+rows+'</table>'+
      '<p class="tip"><b>Técnica:</b> '+esc(ex.k)+'</p>'+
      '<p class="tip"><b>Si molesta:</b> '+esc(ex.alt)+'</p>'+
      (ex.ref&&prev?'<p class="tip"><b>Referencia hoja:</b> '+esc(ex.ref)+'</p>':'')+
    '</div>'+
  '</div>';
}

function ctxActual(){ var f=ACTIVA||HOY; return {f:f,c:byDate[f]}; }

function setSet(i,serie,campo,val){
  var x=ctxActual(), c=x.c; if(!c) return;
  var ex=SESIONES[c.code].ej[i];
  var reg=sesionDe(x.f)||{code:c.code,sesion:SESIONES[c.code].nom,semana:c.semana,fase:c.fase,sets:[],done:false};
  var s=reg.sets.filter(function(y){return y.ex===ex.n&&y.serie===serie})[0];
  if(!s){s={ex:ex.n,orden:i+1,grupo:ex.g,serie:serie,kg:'',reps:'',rir:'',done:false};reg.sets.push(s);}
  s[campo]=val;
  setSesion(x.f,reg);
}
function marcar(i,serie){
  var x=ctxActual(), c=x.c; if(!c) return;
  var ex=SESIONES[c.code].ej[i];
  var reg=sesionDe(x.f)||{code:c.code,sesion:SESIONES[c.code].nom,semana:c.semana,fase:c.fase,sets:[],done:false};
  var s=reg.sets.filter(function(y){return y.ex===ex.n&&y.serie===serie})[0];
  if(!s){s={ex:ex.n,orden:i+1,grupo:ex.g,serie:serie,kg:'',reps:'',rir:'',done:false};reg.sets.push(s);}
  s.done=!s.done;
  // al marcar, arrastra los valores a las series siguientes vacías
  if(s.done){
    var nser=seriesDe(ex,c.semana,c.code);
    for(var k=serie+1;k<=nser;k++){
      var t=reg.sets.filter(function(y){return y.ex===ex.n&&y.serie===k})[0];
      if(!t){t={ex:ex.n,orden:i+1,grupo:ex.g,serie:k,kg:'',reps:'',rir:'',done:false};reg.sets.push(t);}
      if(!t.kg&&!t.reps){t.kg=s.kg;t.rir=s.rir;}
    }
  }
  setSesion(x.f,reg);
  var abierto=document.querySelector('.ex.open');
  var idx=abierto?abierto.id.replace('ex',''):null;
  renderHoy();
  if(idx!==null){var el=document.getElementById('ex'+idx); if(el) el.classList.add('open');}
}
function cerrarSesion(f){
  var reg=sesionDe(f);
  if(!reg||!reg.sets.length){toast('Registra alguna serie antes');return;}
  reg.done=!reg.done; reg.cerrada=new Date().toISOString();
  setSesion(f,reg); renderHoy(); toast(reg.done?'Sesión guardada':'Sesión reabierta');
}

function pintaEvo(){
  var sel=document.getElementById('selEx'); if(!sel) return;
  var n=sel.value, pts=[];
  Object.keys(DB).sort().forEach(function(f){
    var s=DB[f]; if(!s||!s.sets) return;
    var mx=0, det=[];
    s.sets.forEach(function(x){ if(x.ex===n&&x.reps){ det.push(x.reps+(x.kg?'×'+x.kg+' kg':'')); var e=(+x.kg||0)*(1+(+x.reps||0)/30); if(e>mx)mx=e; }});
    if(det.length) pts.push({f:f,e:mx,det:det.join(' · ')});
  });
  var el=document.getElementById('evo');
  if(!pts.length){el.innerHTML='<p class="note">Sin datos de este ejercicio.</p>';return;}
  var max=Math.max.apply(null,pts.map(function(p){return p.e}))||1;
  var w=100,h=34,step=pts.length>1?w/(pts.length-1):0;
  var d=pts.map(function(p,i){return (i?'L':'M')+(i*step).toFixed(1)+','+(h-(p.e/max)*(h-4)-2).toFixed(1)}).join(' ');
  el.innerHTML='<div class="card" style="margin-top:10px">'+
    (pts.length>1?'<svg class="spark" viewBox="0 0 100 '+h+'" preserveAspectRatio="none" width="100%" height="52">'+
      '<path d="'+d+'" fill="none" stroke="#f5a524" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>':'')+
    pts.slice().reverse().map(function(p){return '<div class="hrow"><div><b>'+fmt(p.f)+'</b><span>'+esc(p.det)+'</span></div></div>'}).join('')+
    '<p class="note">La línea usa una estimación de carga (kg × (1 + reps/30)); sirve para ver tendencia, no como 1RM real.</p></div>';
}

function tsv(){
  var out=['Fecha\tCódigo\tSesión\tSemana\tFase\tOrden\tEjercicio\tGrupo\tSerie\tPeso kg\tReps\tRIR\tVolumen kg'];
  Object.keys(DB).sort().forEach(function(f){
    var s=DB[f]; if(!s||!s.sets) return;
    var c=byDate[f]||{};
    s.sets.slice().sort(function(a,b){return (a.orden-b.orden)||(a.serie-b.serie)}).forEach(function(x){
      if(!x.reps&&!x.done) return;
      out.push([f,s.code||c.code||'',s.sesion||c.nom||'',s.semana||c.semana||'',s.fase||c.fase||'',
        x.orden,x.ex,x.grupo||'',x.serie,(x.kg||''),(x.reps||''),(x.rir||''),
        Math.round((+x.kg||0)*(+x.reps||0))].join('\t'));
    });
  });
  return out.join('\n');
}

function bajar(nombre,txt,tipo){
  try{
    var b=new Blob([txt],{type:tipo+';charset=utf-8'}), u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u;a.download=nombre;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500);

function restaurar(inp){

  var r=new FileReader();
  r.onload=function(){ try{ var d=JSON.parse(r.result); DB=d; save(DB); toast('Copia restaurada'); render(); }
    catch(e){ toast('Archivo no válido'); } };
  r.readAsText(f);
}
